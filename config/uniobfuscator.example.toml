# uniobfuscator 配置文件模板
#
# 用法：
#   1) 把本文件复制为 config/uniobfuscator.toml（模板保留不动）
#   2) 修改 path / output 等字段
#   3) 运行：uniobfuscator -c config/uniobfuscator.toml
#
# 优先级：命令行参数 > 按语言配置 > 全局配置 > 内置默认值。
# 注意：相对路径基于命令行工作目录解析，建议写绝对路径。

# ---------------- 全局配置（作用于整个程序） ----------------
# path = "src"              # 待混淆的源文件或目录（也可用命令行位置参数）
# language = "python"       # python / javascript / java（目录模式下用于过滤）
# output = "out"            # 输出路径：单文件=文件路径，目录=输出目录（目录模式必须指定）
# stdout = false            # 单文件结果输出到屏幕而非写文件
# seed = 0                  # 随机种子，保证可复现

# 混淆开关（默认全部开启，设为 false 可关闭）
rename = true               # 标识符重命名
strings = true              # 字符串加密
dead_code = true            # 死代码注入
arithmetic = true           # 算术混淆

# ---------------- 按语言配置（覆盖对应语言的全局开关） ----------------
# 每个语言段可单独设置：seed / rename / strings / dead_code / arithmetic
#
# [languages.python]
# rename = false            # Python 文件不重命名
#
# [languages.javascript]
# seed = 42
#
# [languages.java]
# dead_code = false
